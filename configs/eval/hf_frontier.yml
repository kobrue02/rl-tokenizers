# systems/tokenization/hf_frontier/evaluate.py -- sbatch jobs/eval/hf_frontier.sh -c configs/eval/hf_frontier.yml
#
# TRIMMED 2026-09-16 from 41 to 23 repos, for figure legibility (a 41-line
# resource-level-trend plot and a 41-bar spread leaderboard were both
# unreadable at print size -- see scripts/EVAL_COMPARISON_FIGURES.md-adjacent
# figures/tables brainstorm) and to refocus the comparison on genuinely
# popular/production tokenizers plus this project's own systems, rather than
# a long tail of niche one-off repos. Dropped:
#   - 6 niche multilingual-leaderboard repos (Jarbas/m2v-256-multilingual-e5-small,
#     Jarbas/m2v-256-bge-reranker-v2-m3, Yoonyoul/fine-tuned-e5-small-drugproduct,
#     bluexmas/mbart50_ko_vi, antebe/token_punct_dilute,
#     slone/mbart-large-51-myv-mul-v1) -- added originally only because a
#     leaderboard listed them, not because they're widely used.
#   - 5 of 7 tiktoken encodings (r50k_base, p50k_base, p50k_edit,
#     o200k_harmony) -- kept cl100k_base (GPT-4 era) and o200k_base (GPT-4o/
#     current) as the two meaningful eras; gpt2 (tiktoken) is also dropped
#     as redundant with the real openai-community/gpt2 repo already below.
#   - 7 of 9 encoder tokenizers (bert-base-cased, distilbert-base-uncased,
#     google/electra-base-discriminator, roberta-base, microsoft/deberta-base,
#     microsoft/deberta-v3-base, answerdotai/ModernBERT-base) -- all
#     English-only, adding little to a cross-lingual fairness comparison.
#     Kept the two genuinely multilingual ones: bert-base-multilingual-cased,
#     xlm-roberta-base.
# Explicitly KEPT despite being a niche/obscure repo: meta-models/
# Muse-Glimmer-30B (user call -- worth keeping regardless of popularity).
# Also kept: google/byt5-small, google/canine-s (niche but theoretically
# load-bearing for this thesis's token-tax argument -- the deliberate
# no-vocab byte-level/codepoint-level anchors, not just "more popular
# models"), and every one of the 16 real production/frontier decoder
# tokenizers from the original list (see the trimmed history below for how
# each was verified real before being added -- none guessed).
#
# ORIGINAL VERIFICATION NOTES (for the repos still present below):
#   - meta-models/Muse-Glimmer-30B: a genuinely real, very recently released
#     repo (confirmed live via HfApi -- created 2026-08-09, real safetensors
#     weights, 165k+ downloads already) that simply postdates this
#     assistant's own training-data cutoff, hence not recognized offhand;
#     verified rather than assumed to be real OR fabricated either way, per
#     this project's own "never guess a repo exists" discipline. Byte-level
#     BPE, 200k vocab, round-trips cleanly, no fix needed.
#   - tiktoken:cl100k_base / tiktoken:o200k_base: OpenAI's own tiktoken
#     package, NOT HF Hub repos at all -- see systems/tokenization/hf_frontier/model.py's
#     own module docstring, scheme 3. Selected via a "tiktoken:{name}"
#     pseudo-repo-id rather than a real HF repo_id, since these aren't
#     fetched from the HF Hub at all -- tiktoken.get_encoding() directly, no
#     AutoTokenizer involved, no --trust-remote-code/--hf-token relevance
#     for these specifically (harmless no-ops for them, same as always).
#     Always byte-level BPE by construction (tiktoken's own design
#     guarantee), verified via the same canary round-trip check as every
#     other repo anyway, not assumed.
#   - bert-base-multilingual-cased and xlm-roberta-base (WordPiece /
#     SentencePiece unigram respectively) both originally failed model.py's
#     round-trip check (confirmed live: WordPiece discards whitespace
#     entirely during tokenization -- it's a word-boundary signal, never
#     encoded in any token -- and xlm-roberta-base's SentencePiece tokenizer
#     emits a standalone metaspace-only token whose reported offset overlaps
#     the following token's own start; naive per-token offset slicing either
#     drops those bytes or duplicates them). Fixed properly, not worked
#     around: _spans_via_offsets now tracks a running character high-water
#     mark and always starts the next span exactly where the last one left
#     off rather than trusting each token's own reported start -- see that
#     function's own docstring.
#   - The original 3: deepseek-ai/DeepSeek-V4-Pro, moonshotai/Kimi-K3,
#     meta-llama/Llama-3.1-8B-Instruct.
#   - 8 more frontier/production models: Qwen/Qwen3.8-2.4T-A95B,
#     meta-llama/Llama-3.3-70B-Instruct, openai-community/gpt2,
#     openai/gpt-oss-20b, deepseek-ai/DeepSeek-R1, openai/gpt-oss-120b,
#     facebook/opt-125m, Qwen/Qwen3-8B.
#   - 5 "standard open-source era" decoder models added for genuine
#     TOKENIZER-FAMILY diversity, not just more of the same byte-level BPE
#     the other 11 already are: mistralai/Mistral-7B-v0.1, NousResearch/
#     Llama-2-7b-hf, google/gemma-7b (SentencePiece, span_method=
#     "offset_mapping"), plus bigscience/bloom and tiiuae/falcon-7b (more
#     byte-level BPE, but genuinely distinct vocab sizes/eras).
#   - google/byt5-small and google/canine-s: both mentioned in the
#     background chapter but previously unable to load, since neither is
#     byte-level-BPE (scheme 1) nor offset-mapping-reconstructible (scheme
#     2): both are "slow" (pure-Python) tokenizers whose ids don't come from
#     any merge process at all. Fixed properly in
#     systems/tokenization/hf_frontier/model.py (two new schemes, not a
#     workaround) rather than skipped:
#       - ByT5: id = raw UTF-8 byte + tokenizer.offset (a public attribute, 3
#         here) -- 1 id = 1 byte, no vocab. vocab_size=256.
#       - CANINE: id = Unicode codepoint directly -- 1 id = 1 character, no
#         vocab. vocab_size=0x110000 (1114112), the entire codepoint range.
#     Both verified live via a real HFFrontierTokenizer.load() + canary
#     round-trip, same discipline as every repo above.
#     google/canine-c NOT added alongside canine-s: confirmed live
#     (AutoTokenizer.from_pretrained on both) that CanineTokenizer's
#     vocab_size, special_tokens_map, and all_special_ids are byte-for-byte
#     identical between the two repos -- they differ only in pretrained
#     model WEIGHTS, which this tokenizer-only pipeline never loads, so
#     canine-c would just reproduce canine-s's numbers exactly.
#
# GATED repos in this list (need their license accepted on huggingface.co
# AND your own HF_TOKEN to actually have that access granted -- a plain
# HF_TOKEN without accepted access fails to load just that one repo, same
# as before): meta-llama/Llama-3.1-8B-Instruct, meta-llama/
# Llama-3.3-70B-Instruct, google/gemma-7b.
#
# --trust-remote-code applies to ALL repos below uniformly (harmless no-op
# for the ones that don't need it) -- required for moonshotai/Kimi-K3's own
# custom tokenizer class.
#
# One repo failing (gated-without-access, a transient network error) no
# longer aborts the whole run -- see systems/tokenization/hf_frontier/evaluate.py's own
# per-repo error isolation -- failures land under a "_failed" key in the
# output JSON instead.
hf_repo_id: "deepseek-ai/DeepSeek-V4-Pro,moonshotai/Kimi-K3,meta-llama/Llama-3.1-8B-Instruct,Qwen/Qwen3.8-2.4T-A95B,meta-llama/Llama-3.3-70B-Instruct,openai-community/gpt2,openai/gpt-oss-20b,deepseek-ai/DeepSeek-R1,openai/gpt-oss-120b,facebook/opt-125m,Qwen/Qwen3-8B,mistralai/Mistral-7B-v0.1,NousResearch/Llama-2-7b-hf,google/gemma-7b,bigscience/bloom,tiiuae/falcon-7b,bert-base-multilingual-cased,xlm-roberta-base,meta-models/Muse-Glimmer-30B,tiktoken:cl100k_base,tiktoken:o200k_base,google/byt5-small,google/canine-s"
trust_remote_code: true
eval_data_source: bouquet_test
output: results/hf_frontier_comparison.json
use_wandb: true
run_name: hf_frontier_v8_23models
