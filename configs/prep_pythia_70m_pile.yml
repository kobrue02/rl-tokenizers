# systems/pretraining/data_prep.py -- sbatch jobs/prep_pretraining_data.sh -c configs/prep_pythia_70m_pile.yml
# CPU-only job (jobs/prep_pretraining_data.sh, NOT the _gpu variant -- see
# that script's own header: bpe's induce_spans is plain CPU BPE, no torch
# forward pass, same rationale as configs/prep_bpe_large.yml). Reuses the
# already-trained bpe tokenizer (checkpoints/bpe_50k.json, same one
# pretrain_bpe_large.yml uses) rather than training a new one: this run's
# whole point is validating ModelConfig.architecture=="gpt_neox" (see
# model.py/model_configs.py's "pythia_*" presets) on real data, decoupled
# from any tokenizer-choice variable.
#
# PREREQUISITE: reads from a one-time local disk cache
# (common/data/prepare_pile.py -- run jobs/prepare_pile.sh first), not live
# HF streaming -- re-streaming its ~451GB/1650-shard corpus on every run
# (and every resume) would repeat the exact mistake configs/prep_bpe_large.yml's
# own comment describes for glot500. dataset_config below must point at
# wherever that cache actually landed (pass the real WORK_ROOT path at
# submission time if it isn't at the default PILE_LOCAL_DIR, "data/pile").
dataset: pile
dataset_config: /pfs/work9/workspace/scratch/tu_zxoqp65-rl-tokenizers/data/pile
system: bpe
checkpoint: checkpoints/bpe_50k.json
output_dir: pretrain_data/pile_bpe_pythia_70m
# No max_tokens cap -- a FULL run consumes the entire local Pile cache (all
# ~451GB / however many tokens that tokenizes to under bpe_50k), unlike the
# earlier validation-scale draft of this file, which deliberately capped at
# 500M tokens. This is now the actual token pool
# configs/pretrain_pythia_70m_pile.yml draws randomly-windowed samples from
# (see systems/pretraining/shard_dataset.py's own docstring: training draws
# random windows per step regardless of total_steps, so it can revisit this
# same pool across multiple effective epochs -- the pool itself doesn't need
# to match any particular training step/token budget 1:1).
use_wandb: true
run_name: pythia_70m_pile_data_prep_full
