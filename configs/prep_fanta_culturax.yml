# systems/pretraining/data_prep.py -- sbatch jobs/prep_pretraining_data_gpu.sh -c configs/prep_fanta_culturax.yml
# GPU job (jobs/prep_pretraining_data_gpu.sh, NOT the CPU variant -- fanta's
# induce_spans is a real forward pass per document, same rationale as
# configs/prep_fanta_large.yml).
#
# Replaces configs/prep_fanta_large.yml's glot500 source -- see
# configs/prep_bpe_culturax.yml's own comment for the full rationale
# (short-snippet Glot500 documents + thin per-language token allocation).
dataset: culturax
langs: all
# "all" resolves to common.data.corpora.CULTURAX_LANGS -- see
# configs/prep_bpe_culturax.yml's own comment for what/why (the 106-language
# BOUQuET x CulturaX intersection, matching the tokenizer eval's own
# language set, all 21 XNLI+XCOPA eval languages included natively).
system: fanta
# same tokenizer as the original glot500 run -- see configs/prep_fanta_50k.yml's
# own comment for why these are the real checkpoint/vocab paths (job 6284655).
checkpoint: checkpoints/fanta_6284655.pt
vocab_json: vocab_out/fanta_vocab_6284655.json
output_dir: pretrain_data/culturax_fanta_large
# Same Chinchilla-derived budget as configs/prep_bpe_culturax.yml -- see its
# own comment for the full derivation (679,552,512 non-embedding "large"
# params * 20 tokens/param / 106 languages = 128,217,455 tokens/language).
max_tokens: 13591050230
tokens_per_language: 128217455
# See configs/prep_bpe_culturax.yml's own comment for the full 3-round
# debugging history -- a genuine ~3.5KB/document leak in the underlying
# datasets/parquet streaming implementation means even a bounded batch size
# needs real headroom; 5 concurrent streams keeps total leak to ~2.1GB.
lang_batch_size: 5
# See configs/prep_bpe_culturax.yml's own comment -- confirmed live that
# dedup's LSH near-dup index (unbounded, one MinHash sketch per document
# ever seen -- see common/data/dedup.py's own documented limitation for
# long-document corpora) OOM'd prep after only 5.53M tokens. Disabled here;
# CulturaX is already deduplicated at construction.
dedup: false
use_wandb: true
run_name: fanta_culturax_large_data_prep
