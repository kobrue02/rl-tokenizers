# systems/pretraining/cli.py -- sbatch jobs/train_pretraining.sh -c configs/pretrain_pythia_70m_pile.yml
# Validates ModelConfig.architecture=="gpt_neox" (LayerNorm, plain GELU MLP,
# parallel attn+mlp residual, partial rotary embeddings, small_init/wang_init
# -- see model.py/model_configs.py) end-to-end on real data, at Pythia's own
# smallest real size and its own architecture/optimizer hyperparameters,
# BEFORE committing to a full multilingual run at this scale the way
# pretrain_bpe_large.yml/pretrain_fanta_large.yml already did for the
# "llama" family. Deliberately English-only (pile, see common/data/corpora.py)
# and a much shorter token budget than the paper's own 143,000-step/
# ~300B-token run -- a fast sanity check, not a faithful reproduction of
# either.
shard_dir: pretrain_data/pile_bpe_pythia_70m
model_size: pythia_70m
seq_len: 2048
# Matches EleutherAI/gpt-neox's own configs/pythia/70M.yml
# train_micro_batch_size_per_gpu=32 at seq_length=2048 exactly (65,536
# tokens/step) -- one GPU's worth of that config's real ~32-GPU setup
# (which reaches the paper's 2M-token/step GLOBAL batch via world_size, not
# a bigger per-GPU batch), not the full global batch size itself.
# grad_accum_steps left at its default (1) -- a single GPU is already
# enough to fit a 70M model.
per_device_batch_size: 32
total_steps: 5000
learning_rate: 1.0e-3
# Pythia's own cosine-to-10%-of-peak decay (configs/pythia/70M.yml's own
# "min_lr": 0.0001, exactly 0.1x its "lr": 0.001) -- every "llama"-family
# preset instead decays to 0 (TrainConfig.min_lr_ratio's own default), so
# this is set explicitly rather than left at that default.
min_lr_ratio: 0.1
warmup_ratio: 0.01
output_dir: checkpoints/pretrain_pythia_70m_pile
use_wandb: true
run_name: pythia_70m_pile_validation
