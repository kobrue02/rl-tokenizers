# pretraining/cli_eval.py -- sbatch jobs/evaluate_pretrained.sh -c configs/eval_bpe_large.yml
checkpoint: checkpoints/pretrain_bpe_large/final.pt
system: bpe
tokenizer_checkpoint: checkpoints/bpe_50k.json
benchmark: "xnli,xcopa,flores_mt"
# configs/eval_bpe_50k.yml (the small run's eval config) was still using the
# old narrow "en,de,fr,ar,zh" list -- per configs/eval_fanta_50k.yml's own
# comment, that only gives XCOPA one usable language ("zh"). Carrying
# forward fanta's already-fixed full union of XNLI_LANGS (15) and
# XCOPA_LANGS (11) here instead, so bpe and fanta are evaluated on the same
# language set for a fair comparison, and neither is silently narrowed.
langs: "ar,bg,de,el,en,es,et,fr,hi,ht,id,it,qu,ru,sw,ta,th,tr,ur,vi,zh"
lang_pairs: "eng:spa,eng:arz,eng:ben"
max_examples: 4000
output: results/all_bpe_large.json
use_wandb: true
run_name: bpe_large_450k_steps
