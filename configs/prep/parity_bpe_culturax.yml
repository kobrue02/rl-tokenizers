# systems/pretraining/data_prep.py -- sbatch jobs/prep/pretraining_data.sh -c configs/prep/parity_bpe_culturax.yml
# CPU-only job (jobs/prep/pretraining_data.sh, NOT the _gpu variant --
# parity_bpe's induce_spans is plain CPU BPE, no torch forward pass, same
# rationale as configs/prep/bpe_culturax.yml).
#
# Extends the bpe_culturax/fanta_culturax "large"-scale CulturaX re-run to
# parity_bpe -- 2026-09-19: glot500 dropped as a pretraining data source
# project-wide, parity_bpe_50k's own glot500 prep (mid-resume at the time)
# cancelled and removed; this replaces it, not resumes it.
#
# checkpoint below is the SAME job (6370066, the later of two
# parity_bpe tokenizer checkpoints on disk) configs/prep/own_tokenizers_indigenous_panel.yml
# already uses -- see that file's own comment for the disambiguation
# history if a different variant's checkpoint is ever needed instead.
dataset: culturax
langs: all
system: parity_bpe
checkpoint: checkpoints/parity_bpe_6370066.json
output_dir: pretrain_data/culturax_parity_bpe_large
max_tokens: 13591050230
tokens_per_language: 128217455
lang_batch_size: 5
dedup: false
use_wandb: true
run_name: parity_bpe_culturax_large_data_prep
