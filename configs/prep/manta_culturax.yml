# systems/pretraining/data_prep.py -- sbatch jobs/prep/pretraining_data_gpu.sh -c configs/prep/manta_culturax.yml
# GPU job -- manta's induce_spans is a real forward pass per document, same
# rationale as configs/prep/fanta_culturax.yml/magnet_culturax.yml.
#
# Extends the bpe_culturax/fanta_culturax "large"-scale CulturaX re-run to
# manta -- 2026-09-19: glot500 dropped project-wide, manta_50k's own
