# systems/pretraining/data_prep.py -- sbatch jobs/prep/pretraining_data.sh -c configs/prep/pythia_70m_pile.yml
# CPU-only job (jobs/prep/pretraining_data.sh, NOT the _gpu variant -- see
# that script's own header: bpe's induce_spans is plain CPU BPE, no torch
# forward pass, same rationale as configs/prep/bpe_large.yml). Reuses the
# already-trained bpe tokenizer (checkpoints/bpe_50k.json, same one
# configs/pretrain/bpe_large.yml uses) rather than training a new one: this run's
# whole point is validating ModelConfig.architecture=="gpt_neox" (see
# model.py/model_configs.py's "pythia_*" presets) on real data, decoupled
# from any tokenizer-choice variable.
#
# PREREQUISITE: reads from a one-time local disk cache
# (common/data/prepare_pile.py -- run jobs/prep/pile.sh first), not live
# HF streaming -- re-streaming its ~451GB/1650-shard corpus on every run
# (and every resume) would repeat the exact mistake configs/prep/bpe_large.yml's
# own comment describes for glot500. dataset_config below must point at
# wherever that cache actually landed (pass the real WORK_ROOT path at
# submission time if it isn't at the default PILE_LOCAL_DIR, "data/pile").
dataset: pile
dataset_config: /pfs/work9/workspace/scratch/tu_zxoqp65-rl-tokenizers/data/pile
system: bpe
checkpoint: checkpoints/bpe_50k.json
output_dir: pretrain_data/pile_bpe_pythia_70m
# No max_tokens cap -- a FULL run consumes the entire local Pile cache (all
# ~451GB / however many tokens that tokenizes to under bpe_50k), unlike the
# earlier validation-scale draft of this file, which deliberately capped at
# 500M tokens. This is now the actual token pool
# configs/pretrain/pythia_70m_pile.yml draws randomly-windowed samples from
# (see systems/pretraining/shard_dataset.py's own docstring: training draws
# random windows per step regardless of total_steps, so it can revisit this
# same pool across multiple effective epochs -- the pool itself doesn't need
# to match any particular training step/token budget 1:1).
# Confirmed live: an earlier attempt at this job showed 0.00% CPU
# efficiency while holding ~98.8% of its memory for the FULL 12h time
# limit -- effectively a hang, not just slow processing. common/data/
# dedup.py's near-dup MinHash/LSH pass runs on each document's FULL,
# UNTRUNCATED text (see data_prep.py's own _dedup_and_truncate: dedup
# happens BEFORE max_doc_bytes truncation, by design, so a truncated
# document's dedup identity still matches its real content) -- the same
# mechanism that OOM'd configs/prep/bpe_culturax.yml on CulturaX's merely
# long (median ~2KB) documents would be far worse here: the Pile's raw
# source mix (GitHub, Books3, ArXiv, ...) includes genuinely enormous
# individual documents (full repos/books, sometimes megabytes), and
# computing MinHash shingles over one such outlier plausibly explains both
# symptoms (memory pressure -> swapping -> near-zero effective CPU).
# Disabled here for the same reason it's redundant on CulturaX, only more
# so: this dataset is literally named "the_pile_deduplicated" -- it's
# already deduplicated at the source.
dedup: false
use_wandb: true
run_name: pythia_70m_pile_data_prep_full
