# systems/pretraining/data_prep.py -- sbatch jobs/prep/pretraining_data_gpu.sh -c configs/prep/magnet_culturax.yml
# GPU job (jobs/prep/pretraining_data_gpu.sh, NOT the CPU variant -- magnet's
# induce_spans is a real forward pass per document, same rationale as
# configs/prep/fanta_culturax.yml).
#
# Extends the bpe_culturax/fanta_culturax "large"-scale CulturaX re-run
# (see configs/prep/bpe_culturax.yml's own comment for the full rationale:
# Glot500 documents were confirmed to be single sentences/short fragments,
# not real documents) to magnet -- 2026-09-19: glot500 dropped as a
# pretraining data source project-wide, magnet_50k's own glot500 prep/
# pretrain (in-progress at the time) cancelled and removed; this replaces
# it, not resumes it.
dataset: culturax
langs: all
system: magnet
checkpoint: checkpoints/magnet_6269682.pt
vocab_json: vocab_out/magnet_vocab_6269682.json
output_dir: pretrain_data/culturax_magnet_large
# Same Chinchilla-derived budget as configs/prep/bpe_culturax.yml -- see its
# own comment for the full derivation (679,552,512 non-embedding "large"
# params * 20 tokens/param / 106 languages = 128,217,455 tokens/language);
# vocab-independent, so identical here.
max_tokens: 13591050230
tokens_per_language: 128217455
# See configs/prep/bpe_culturax.yml's own comment for the full 3-round
# debugging history behind lang_batch_size/dedup below -- identical
# rationale, not re-derived per system.
lang_batch_size: 5
dedup: false
use_wandb: true
run_name: magnet_culturax_large_data_prep
