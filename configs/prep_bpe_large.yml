# systems/pretraining/data_prep.py -- sbatch jobs/prep_pretraining_data.sh -c configs/prep_bpe_large.yml
# NOT the _gpu variant -- bpe's induce_spans is plain CPU BPE, no torch
# forward pass (see jobs/prep_pretraining_data_gpu.sh's own header: "bpe/
# superbpe have no use for a GPU here"). This file previously said
# prep_pretraining_data_gpu.sh (copy-pasted from configs/prep_fanta_large.yml's
# template and never corrected) -- confirmed live: that wastes an entire
# A100 doing nothing for bpe's whole run, and co-locates it on the same
# node as a job that DOES need the GPU (fanta), contending for that node's
# shared CPU/memory/disk bandwidth for no benefit.
dataset: glot500
langs: all
# glot500 now reads from a one-time local disk cache (common/data/prepare_glot500.py
# -- run jobs/prepare_glot500.sh once first) instead of live HF streaming;
# dataset_config overrides the default GLOT500_LOCAL_DIR ("data/glot500")
# to point at the real WORK_ROOT cache -- see common/data/corpora.py's
# stream_groups docstring. (This previously claimed the run already
# completed via an old live-streaming path -- confirmed stale/wrong:
# output_dir has a real prep_checkpoint.json and partial shards but no
# shards_meta.json, i.e. genuinely in progress, not done.)
dataset_config: /pfs/work9/workspace/scratch/tu_zxoqp65-rl-tokenizers/data/glot500
system: bpe
checkpoint: checkpoints/bpe_50k.json
output_dir: pretrain_data/glot500_bpe_large
# see configs/prep_fanta_large.yml's own comment -- same rationale, raised
# from the small run's 5,000,000,000 cap so per-language exposure actually
# increases rather than just repeating the same tokens more times.
max_tokens: 30000000000
use_wandb: true
run_name: bpe_large_data_prep
