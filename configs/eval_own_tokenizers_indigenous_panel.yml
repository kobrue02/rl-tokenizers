# scripts/evaluate_own_tokenizers_indigenous_panel.py -- sbatch jobs/evaluate_own_tokenizers_indigenous_panel.sh
#
# Runs all 5 of this project's own trained tokenizers through
# common.data.indigenous_panel's curated Indigenous-language panel in ONE job
# (evaluate.py only dispatches one system per invocation -- see that module's
# own docstring -- so five separate sbatch submissions would otherwise be
# needed). Requires a one-time `python -m common.data.prepare_indigenous_panel`
# run first (writes to data/indigenous_panel/).
#
# checkpoint: whatever --output-dir each system's OWN `train.py <name>` run
# actually wrote -- job-ID-tagged, cluster-specific. bpe/fanta are copied from
# configs/eval_bpe_50k.yml and configs/eval_fanta_50k.yml's own
# tokenizer_checkpoint fields (the exact same artifact, just a different
# downstream consumer; fanta_6284655.pt specifically -- see that config's own
# comment -- not the older fanta_6257621.pt also present in checkpoints/).
# flexitokens/magnet/manta filled in from a live `ls checkpoints/` on the
# actual cluster (2026-08-17) -- re-check if any of the 5 get retrained.
#
# parity_bpe added 2026-08-19: never had an indigenous_panel eval run at all
# (only results/parity_bpe_comparison.json, the bouquet_test one, exists).
# CHECKPOINT PATH BELOW IS A PLACEHOLDER -- run `ls checkpoints/ | grep
# parity_bpe` on the cluster (see jobs/train_parity_bpe.sh's own
# CHECKPOINT_PATH="$PROJECT_ROOT/checkpoints/parity_bpe_${SLURM_JOB_ID}.json"
# convention) and fill in the real job-ID-tagged filename before submitting.
systems:
  - name: bpe
    checkpoint: checkpoints/bpe_50k.json
  - name: fanta
    checkpoint: checkpoints/fanta_6284655.pt
  - name: flexitokens
    checkpoint: checkpoints/flexitokens_6269683.pt
  - name: magnet
    checkpoint: checkpoints/magnet_6269682.pt
  - name: manta
    checkpoint: checkpoints/manta_6269684.pt
  - name: parity_bpe
    checkpoint: checkpoints/parity_bpe_6370066.json
output_dir: results
combined_output: results/own_tokenizers_indigenous_panel.json
